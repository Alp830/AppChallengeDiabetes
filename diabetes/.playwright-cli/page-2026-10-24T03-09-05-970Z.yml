  - generic [ref=e18]:
    - heading "Problem" [level=2] [ref=e19]
    - paragraph [ref=e20]: The current picker has a remembered “Balance my meal” checkbox, but no explicit nutrient priorities. Suggestions are generated directly by Gemini rather than scored from a local recipe catalog. The prompt contains soft balance and evening guidance, and cost is currently a free-text, rough per-serving estimate. The parser truncates excess results but does not enforce an exact count or budget tradeoff policy.
    - paragraph [ref=e21]: Simply adding prompt text would leave conflicts ambiguous and could silently show over-budget food or omit the required explanation.
  - generic [ref=e22]:
    - heading "Solution and agreed behavior" [level=2] [ref=e23]
    - list [ref=e24]:
      - listitem [ref=e25]: All three checkboxes default off, support any combination, and have equal priority. These are relative food preferences, not strict gram targets or verified nutritional claims.
      - listitem [ref=e26]: Keep “Balance my meal” separate and unchanged as a control. Nutrient preferences work independently of it and of the diabetes feature flag.
      - listitem [ref=e27]: Persist on the existing user document. With no account, changes remain local to the mounted picker; do not create anonymous cloud records.
      - listitem [ref=e28]:
        - text: Label the existing budget input
        - strong [ref=e29]: Budget per serving
        - text: ", validate a positive finite dollar amount, and use the same unit in prompts and results."
      - listitem [ref=e30]: When all requirements are achievable, favor meals matching the selected nutrients within budget. Do not force a mixed fallback or exceed budget unnecessarily.
      - listitem [ref=e31]: If constraints conflict, keep exactly the requested number and use the fallback allocation below. Nutrition-first alternatives may exceed budget, but must be clearly labeled. Budget-first options relax nutrition as necessary, never allergies or food safety.
      - listitem [ref=e32]:
        - text: For a single requested meal, budget wins. A
        - strong [ref=e33]: persistent visible notice
